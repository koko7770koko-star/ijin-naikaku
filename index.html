/* 計器盤 */
.dash{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ai);padding-block:8px 6px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--ai3)}

.turnline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.event{padding:18px;border:1px solid var(--kin-dim);border-radius:10px;background:var(--ai2);display:flex;flex-direction:column;gap:10px}

/* 内政 */
.cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.cmd{text-align:left;background:var(--ai2);border:1px solid var(--ai3);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cmd:hover:not(:disabled){border-color:var(--kin)}
.cmd:disabled{opacity:.35}
.cmd .t{font-weight:700}

.report{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--ai2);border-radius:10px}

/* 閣僚 */
.mins{display:flex;flex-direction:column;gap:8px}

.min .disc .bar{flex:1}
.min .disc.hot{color:var(--shu)} .min .disc.hot .bar i{background:var(--shu)}
.min.empty{border-style:dashed;border-color:var(--shu)}

.log{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--sumi)}
.log div{display:flex;gap:8px}
.log span:first-child{color:var(--kin);font-variant-numeric:tabular-nums;flex:none;width:2.4em}

/* 結末 */
.rank{font-family:var(--f-disp);font-size:2.3rem;color:var(--kin);line-height:1.2}

.final div{background:var(--ai2);border-radius:6px;padding:10px}

@media (prefers-reduced-motion:reduce){.bar i,.seatbar i{transition:none}}

/* ===== グラフィック強化（場面の背景・演出） ===== */
#sceneBg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none;opacity:0;transition:opacity .6s ease}

.wrap{position:relative;z-index:1}

/* v58 組閣のタップミス対策 */
.cc,.pseat,.plb,.cand,.dg,.choice,.act,.btn,.piece{touch-action:manipulation;-webkit-tap-highlight-color:rgba(212,178,95,.25)}
.cgrid{gap:8px}

/* v57 スマホ操作：行き先ボタン・駒の当たり判定 */
.piece::before{content:"";position:absolute;inset:-7px;border-radius:50%}

}
/* v66 国ごとの外交 */
.ctrys{display:flex;gap:4px;flex-wrap:wrap}.ct{display:flex;align-items:baseline;gap:3px;font-size:.74rem;font-variant-numeric:tabular-nums;padding:1px 8px 1px 2px;border-radius:999px;background:var(--ai2);border:1px solid var(--ai3)}

function setScene(name){const el=document.getElementById("sceneBg");if(!el||curScene===name)return;curScene=name;

/* 閣議室の図：実際に任命した総理と大臣をデータから並べる */
function cabScene(pm,cab,o){o=o||{};
  const ids=[pm,...Object.values(cab),...(o.team||[])];
  const clash=new Set();try{activeBonds(ids).filter(b=>b.kind==="clash").forEach(b=>b.k.filter(k=>ids.includes(k)).forEach(k=>clash.add(k)))}catch(e){}
  (o.angry||[]).forEach(k=>clash.add(k));
  let bub=null;if(o.bubble)bub=o.bubble;
  const P=(k,lab,sz,i)=>{if(!k)return `<div class="cs-p" style="animation-delay:${i*.04}s"><small>${lab}</small><span class="empty"></span><b>―</b></div>`;
    const cls=[clash.has(k)?"clash":"",o.sel===k?"sel":"",o.fresh===k?"new":""].join(" ");
    return `<div class="cs-p ${cls}" style="animation-delay:${i*.04}s"><small>${lab}</small>${portrait(k,sz,clash.has(k)?"angry":"happy")}<b>${nameOf(k)}</b>${bub&&bub[0]===k?`<span class="cs-bub">${spTx(bub[1])}</span>`:""}</div>`};
  const xs=XPOSTS.filter(p=>cab[p.id]);
  return `<div class="cab-scene" style="background-image:url(${BGI.cabinet})">
    <div class="cs-ttl">首相官邸　閣議室</div>
    <div class="cs-pm">${P(pm,"総理",52,0)}</div>
    <div class="cs-rows">${POSTS.map((p,i)=>P(cab[p.id],p.short,36,i+1)).join("")}</div>
    ${xs.length?`<div class="cs-x">${xs.map((p,i)=>P(cab[p.id],p.short,30,i+7)).join("")}</div>`:""}
    ${clash.size?`<div class="cs-legend">赤く光る人は、犬猿の仲や不満を抱えている</div>`:""}
  </div>`;
}
function banterFor(gain,ids){for(const b of gain||[]){const L=(typeof BANTER!=="undefined"&&BANTER[b.n])||null;if(L){const l=L.find(x=>ids.includes(x[0]));if(l)return l}}return null}
/* 採決の演出（判定は既存のまま。票数は結果に合わせた見せ方） */
function mkVote(t,ok,big,kind){let base=233;try{base=projSeats()}catch(e){}
  const r=Math.random();let yes;
  if(kind==="fushin"){yes=ok?Math.min(232,Math.max(120,Math.round(465-base*(.95+r*.06)))):Math.max(233,Math.round(465-base*(.85+r*.1)));}
  else yes=ok?Math.max(234,Math.min(448,Math.round(base*(.94+r*.08)))):Math.min(232,Math.max(140,Math.round(base*(.86+r*.1))));
  const ab=Math.round(r*6);const no=465-yes-ab;
  (S.votes=S.votes||[]).push({m:S.month,t,ok,big:!!big,yes,no,kind:kind||"bill",seen:false});}
function voteCards(list){if(!list.length)return "";
  const h=`<div class="votes">${list.map(v=>{const pass=v.kind==="fushin"?!v.ok:v.ok;const lab=v.kind==="fushin"?(v.ok?"否決":"可決"):(v.ok?"可決・成立":"否決");
    return `<div class="vote ${v.kind==="fushin"?(v.ok?"ok":"ng"):(v.ok?"ok":"ng")}"><div class="vh">${v.big?`<span class="big">重要法案</span>`:""}<b>${v.t}</b><span class="res">${lab}</span></div>
      <div class="vbar"><i class="y" data-w="${v.yes/465*100}"></i><i class="n" data-w="${v.no/465*100}"></i><s></s></div>
      <div class="vnums"><span>賛成 <b>${v.yes}</b></span><span>過半数 233</span><span>反対 <b>${v.no}</b></span></div></div>`}).join("")}</div>`;
  setTimeout(()=>document.querySelectorAll(".vbar i[data-w]").forEach(i=>i.style.width=i.dataset.w+"%"),60);
  return h;}

した。", "噂は耳に、策は胸に。それが忍の流儀。", "探りの報、今朝のうちに揃えまする。"], "rikyu": ["茶は服のよきように点てるもの。政も同じ。", "和敬清寂。争いも茶室では静まりましょう。", "狭い茶室ほど、本音が出るものです。"], "hokusai": ["富士はな、見る場所で顔が変わるのさ。", "九十まで生きりゃ、本物の絵が描けらあ。", "引っ越しは九十回超えと伝わる。身軽が取り柄さ。"], "yataro": ["海運は国の血の道じゃ。押さえにゃならん。", "土佐の地下浪人から、ここまで来たんじゃ。", "西南の役の輸送も、うちの船が引き受けた。"], "okuma": ["早稲田は在野の精神でいくのである！", "議論は恐れず、とことん論じるのである！", "爆弾で脚を失っても、国会へ歩くのである！"], "nitobe": ["武士道を、世界に伝える一書を著しました。", "国際連盟では、事務次長を務めました。", "相互理解こそ、平和の礎です。"], "honda": ["生涯の戦で、かすり傷ひとつ無かったと伝わる。", "無駄口は叩かん。任された務めを果たす。", "退く時を誤らぬのも、武士の務めよ。"], "oguri": ["ねじ一本も国産できねば、独り立ちはできませぬ。", "横須賀には、仏国の技師ヴェルニー殿と築きました。", "株式会社や簿記も、学んで参りました。"], "iwakura": ["使節団で、条約改正の壁を思い知りました。", "憲法は国の形。急がず、しかし確かに。", "表で語れぬ話も、政には付き物でしょう。"], "korekiyo": ["軍事費は、際限なく膨らませてはなりません。", "金融恐慌には、モラトリアムで臨みました。", "まず市中に金を回す。話はそれからです。"], "goto": ["まず調べる。調査なくして計画なしです。", "区画整理なくして、復興はなりません。", "金を残すは下、人を残すは上と申します。"], "manjiro": ["鳥島では、百四十三日耐え抜きました。", "咸臨丸にも、通訳として乗りました。", "言葉が通じれば、話は半分済みます。"], "asako": ["炭鉱も、銀行も、保険も手がけました。", "男も女も、働いてこそ国は富みます。", "まずは自分の足で、現場を確かめます。"], "kumagusu": ["粘菌は、小さくても森の宝です。", "エコロギーという語を、早くから使いました。", "調べもせずに決めるのは、学問ではない。"], "himiko": ["鬼道の託宣を、今日の会議にも告げよう。", "魏の都へ使いを送り、盟を結ぶがよい。", "乱れた国を鎮めるため、わらわは立ったのじゃ。"], "noguchi": ["黄熱の研究に、寝る間も惜しみません。", "人の三倍努力する。それが私の流儀です。", "顕微鏡の前では、昨日の自分に負けたくない。"], "mutsu": ["『カミソリ大臣』と呼ばれても構いません。", "領事裁判権の撤廃、この手で成し遂げます。", "『蹇蹇録』に、交渉の全てを記しておきます。"], "yoritomo": ["御家人の働きには、必ず恩賞で報いる。", "守護と地頭を置き、諸国に目を配る。", "平氏を討った後こそ、政の腕の見せ所だ。"], "yoshinobu": ["水戸の学問で、時勢は読んでおります。", "写真と馬が趣味でな。閣議の後は気晴らしだ。", "幕府の看板より、国の行く末が大事です。"], "shoin": ["草莽の志士にこそ、国を変える力がある。", "知るだけでは足りぬ。行ってこその学問です。", "身はたとえ朽ちるとも、志は留め置く。"], "basho": ["月日は百代の過客。政もまた旅です。", "不易流行。変わらぬ芯と、新しい風を。", "古池や、と一句。会議が静まりましたな。"], "genpaku": ["腑分けを見て、蘭書の正しさを知りました。", "『ターヘル・アナトミア』を皆で訳したのです。", "艪も舵もない船で、大海に出た心地でした。"], "akiko": ["君死にたまふことなかれ。今もそう思います。", "女も学び、働き、堂々と意見を述べましょう。", "子を育てながら、筆を執ってまいりました。"], "ichiyo": ["筆一本で家を支えた身、銭の重さを知ります。", "龍泉寺町の小さな店で、暮らしを見ました。", "お札になるより、民の暮らしが先でしょう。"], "itagaki": ["民撰議院設立建白書を、思い出してくれ。", "国会を開け。民の声が政を動かすのだ。", "立志社で、民の力を育てたものよ。"], "yoshimitsu": ["明の皇帝から、日本国王の称号を受けた。", "勘合を用い、倭寇の取締りも進めよう。", "南北朝を一つにしたのは、このわしだ。"], "ii": ["徳川の先陣は、この直政が務めます。", "武田の旧臣を、赤備えに迎え入れました。", "関ヶ原の傷が痛もうと、務めは果たします。"], "shozan": ["西洋の学問は、国を守る道具にございます。", "大砲も自ら鋳た。机上の論では国は守れぬ。", "世界の情勢を知らずして、国政は語れませぬ。"], "yamagata": ["徴兵令は、国民皆兵の礎にございます。", "奇兵隊の頃から、兵の大切さは存じております。", "庭いじりも好みますが、今は防備が先です。"], "inukai": ["言論で戦うのが、政治家の本分ですぞ。", "普通選挙の実現を、急ぎましょう。", "木堂の号にかけて、筋は曲げませぬ。"], "komura": ["ポーツマスでは、一歩も引きませんでした。", "日英同盟の価値を、改めて確認しましょう。", "理は我にあり。落ち着いて交渉に臨みます。"], "godai": ["薩摩の留学で、世界の工業を見てまいった。", "大阪の取引所を、商人の手で整えよう。", "目先の利より、百年先の大阪を見ます。"], "ginko": ["医術開業試験の門を、女にも開いてください。", "恥じらいで受診をためらう女性を、救いたい。", "湯島に医院を構え、人々を診てきました。"], "tadataka": ["五十歳を過ぎてから学び始めました。", "歩測と星の観測で、誤差を正します。", "地図は国の骨組み。防災にも使えます。"], "yukichi": ["まず、数字と事実で議論しましょう。", "学問なき国は、他国に侮られます。", "人材への投資こそ、最大の政策です。"], "date": ["宴の支度は任せよ。もてなしも政じゃ。", "支倉常長を遣わした時から、海の先を見ておる。", "遅れた分は、派手に取り戻すまでよ。"], "umeko": ["幼くして海を渡り、十一年学びました。", "女子英学塾を、全国に広げたいのです。", "まず、学べる場所を作りましょう。"], "kiyomori": ["兵庫の港を整え、宋の船を迎えましょう。", "厳島の社殿のように、国も栄えさせる。", "武士も政の席に座る時代じゃ。"], "takasugi": ["決断は今じゃ。迷う間に世は動く。", "身分で人を選ぶ世は、もう終わりじゃ。", "功山寺で挙兵した時も、反対は多かった。"], "musashi": ["言葉の刃も、間合いが肝心にござる。", "二刀とも使うてこそ。政も両輪で。", "千日を鍛、万日を錬とす。政も稽古よ。"], "gennai": ["ないものは作る。それが知恵ってもんよ！", "火浣布に寒暖計、種は尽きんぜ！", "輸入に頼らず、国産で稼ごうぜ。"], "togo": ["訓練に勝る備えはありません。", "敵前での回頭、覚悟が要ります。", "勝って兜の緒を締めよ、です。"], "hirobumi": ["憲法は欧州で学び、日本に合わせました。", "まず、足元の制度から整えましょう。", "英国で学んだ身。外交は信頼が第一です。"], "kitasato": ["予防に勝る治療なし。衛生が第一です。", "破傷風の血清療法、世界に示しました。", "ペストの現場へ、まず私が参ります。"], "michinaga": ["和をもって進めよう。歌も一首添えてな。", "人事は気配りじゃ。皆の顔を立てよう。", "今日の会議も、日記に記しておこう。"], "sakai": ["殿のため、場を和ませるのも務めよ。", "長篠では背後の砦を突きましたぞ。", "徳川四天王の筆頭、酒井忠次にござる。"], "shonan": ["堯舜の道を、今の世に開くのです。", "鎖国は通りませぬ。交易を開くべきです。", "民を富ませることが、政の根本です。"], "hara": ["地方の鉄道と学校を、まず整えましょう。", "盛岡の生まれ、賊軍と呼ばれた藩の出です。", "実務を積み重ねて、一歩ずつ進めます。"], "ozaki": ["議会は言論の場。堂々と論じましょう。", "議員生活は六十年を超えました。", "憲政の神様と呼ばれても、驕りはせん。"], "omura": ["適材適所。身分は問いません。", "地図と数字が、戦の半分を決めます。", "蘭学、兵学、医学、一通り学びました。"], "kano": ["まず学び、次に教え、共に栄えましょう。", "体育も教育の柱。身体と心を磨きます。", "アジア初のIOC委員を務めました。"], "raicho": ["他人の言葉ではなく、自分の声で語ります。", "女性にも参政権を。新婦人協会で訴えました。", "母と子を守る政策こそ、国の土台です。"], "niijima": ["幕府の禁を破り、函館から密航して渡米しました。", "アメリカで学び、帰国して同志社英学校を開きました。", "良心を手腕とする人物を育てたいのです。"], "tenshin": ["東京美術学校の創立に力を尽くしました。", "英語で『茶の本』を著し、茶の心を世界に伝えました。", "日本美術院を興し、新しい日本画を育てました。"], "imoko": ["推古天皇の使いとして、隋へ渡りました。", "隋の皇帝の返書を、帰り道で失ったと伝わります。", "裴世清を伴って帰り、国と国の行き来を開きました。"], "maejima": ["飛脚に代わる郵便の仕組みを作りました。", "「郵便」「切手」という言葉を定めたと伝わります。", "漢字を減らし、かなで学ぼうと建白しました。"]};

  } else if(o.hair==="messy"){
    g+=`<path d="M${L-1} 44 L${L+3} 30 L42 35 L46 26 L51 33 L56 25 L59 33 L${R-2} 28 L${R+1} 44 Q${R-2} 34 50 34 Q${L+2} 34 ${L-1} 44Z" fill="${HR}"/><path d="M${R} 26 L${R+8} 18 L${R+5} 27 L${R+11} 25 L${R+3} 33Z" fill="${HR}"/>`;

  } else if(o.hair==="balding"){

  }

  let b=o.brow||"normal"; if(angry)b="angry"; if(happy&&b!=="fierce")b="soft";
  const brow={normal:[[38,by,46,by-.5],[54,by-.5,62,by]],soft:[[38,by,46,by-1.5],[54,by-1.5,62,by]],bold:[[37,by-1,46,by],[54,by,63,by-1]],fierce:[[37,by-2,46,by+1],[54,by+1,63,by-2]],angry:[[37,by-3,46,by+1.5],[54,by+1.5,63,by-3]]}[b];

  const M={calm:`<path d="M46 60.5 Q50 61.5 54 60.5" stroke="#8a4a3a" stroke-width="1.6" fill="none" stroke-linecap="round"/>`,
   smile:`<path d="M45 59.5 Q50 63.5 55 59.5" stroke="#8a4a3a" stroke-width="1.7" fill="none" stroke-linecap="round"/>`,

  if(o.beard==="chin") g+=`<path d="M46.5 64.5 Q50 70 53.5 64.5 Q50 66 46.5 64.5Z" fill="${HR}"/>`;
  if(o.beard==="thin") g+=`<path d="M50 64 L50 70" stroke="${HR}" stroke-width="1.4" stroke-linecap="round"/>`;
  // 小物
  if(o.crest){[[22,88],[78,88]].forEach(([x,y])=>g+=`<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="#e9d9a8" stroke-width="1.1"/>${[0,120,240].map(a=>`<ellipse cx="${x}" cy="${y-2.4}" rx="1.6" ry="2.4" fill="#e9d9a8" transform="rotate(${a} ${x} ${y})"/>`).join("")}`)}
  if(o.dog) g+=`<g transform="translate(76 84)"><path d="M-8 -6 L-9 3 L-4 -1Z M8 -6 L9 3 L4 -1Z" fill="#c9a27a"/><circle r="8" fill="#f4efe6"/><circle cx="-3" cy="-1" r="1.2" fill="#222"/><circle cx="3" cy="-1" r="1.2" fill="#222"/><ellipse cy="3" rx="2" ry="1.4" fill="#222"/></g>`;
  if(angry) g+=`<path d="M${R-2} 30 l4 -2 m-2 5 l5 0 m-3 3 l4 2" stroke="#e0644c" stroke-width="1.8" stroke-linecap="round"/>`;
  return `<svg class="pt" width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="${key==="ieyasu"?"徳川家康":(C[key]||OPP[key])?.n||""}"><defs><clipPath id="${id}"><circle cx="50" cy="50" r="49"/></clipPath></defs><g clip-path="url(#${id})"><rect width="100" height="100" fill="${o.bg}"/><circle cx="50" cy="38" r="40" fill="#fff" opacity=".06"/>${g}</g><circle cx="50" cy="50" r="48.6" fill="none" stroke="#d4b25f" stroke-width="1.4" opacity=".7"/></svg>`;

  sh.querySelectorAll("[data-dest]").forEach(b=>b.onclick=()=>{if(!S.sel||S.day>=30||S.pend!=null||S.banter)return;S.dest=b.dataset.dest;drawSheet();drawMap();const t=$("#sheet");if(t&&t.scrollIntoView)try{t.scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}});
  const cs=$("#cancelSel");if(cs)cs.onclick=()=>{S.sel=null;S.dest=null;drawSheet();drawMap()};
  const cl=$("#closeLook");if(cl)cl.onclick=()=>{S.look=null;drawSheet();drawMap()};
}
function onPiece(k,kind){
  if(S.day>=30||S.pend!=null||S.banter)return;
  if(kind.startsWith("wand")){wandTap(k);return}
  if(kind==="own"){S.sel=S.sel===k?null:k;S.dest=null;S.look=null;}
  else if(kind==="scout"){S.look=S.scout.r;S.sel=null;}
  else {S.look=S.op[k].r;S.sel=null;}
  drawSheet();drawMap();
}
function refreshDash(){const d=document.querySelector(".dash");if(d){const t=document.createElement("div");t.innerHTML=dash();d.replaceWith(t.firstElementChild);const vc=$("#viewCab");if(vc)vc.onclick=()=>{S.view=S.view==="main"?"cab":"main";stopLoop();render();}}}
function stopLoop(){loopId++;}
function bindMap(){
  document.querySelectorAll(".reg").forEach(g=>g.onclick=()=>{const r=g.dataset.r;if(S.day>=30||S.pend!=null||S.banter)return;
    if(S.sel){S.dest=r;} else {S.look=S.look===r?null:r;} drawSheet();drawMap();const t=$("#sheet");if(t&&t.scrollIntoView&&(S.dest||S.look))try{t.scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}});
  $("#pp").onclick=()=>{if(S.day>=30||S.pend!=null)return;S.paused=!S.paused;S.autoPaused=false;drawMap();save()};
  $("#spd").onclick=e=>{S.speed=S.speed===1?2:S.speed===2?4:1;e.target.textContent="×"+S.speed};
  $("#kantei").onclick=()=>{S.view="kantei";stopLoop();save();render();window.scrollTo(0,0)};
  $("#endTurn").onclick=()=>{stopLoop();endMapTurn()};
  tick_ui.ticker=true;drawMap();drawSheet();
  const my=++loopId;lastT=performance.now();uiAcc=0;saveAcc=0;
  const step=t=>{ if(my!==loopId)return;
    const dt=Math.min(.1,(t-lastT)/1000);lastT=t;
    if(!S.paused&&S.pend==null&&!S.banter&&S.day<30){const was=S.pend;mapTick(dt*S.speed/DAY_SEC);
      if(S.pend!=null||S.banter||S.day>=30){drawSheet();}
      uiAcc+=dt;saveAcc+=dt;if(uiAcc>.5){uiAcc=0;refreshDash();if(S.look||(!S.sel&&!S.dest))drawSheet();}
      if(saveAcc>4){saveAcc=0;save()}
      if(checkFallRT())return;}
    drawMap();
    requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function checkFallRT(){ if(S.st.sup<=10||S.st.coh<=10){if(kobuRescue()){save();return false}stopLoop();checkFall();return true} return false; }

const synBonds=s=>s.r.map(n=>BONDS.find(b=>b.n===n)).filter(Boolean);
function activeSyn(ids){const on=activeBonds(ids).filter(b=>kindOf(b)!=="clash").map(b=>b.n);return SYN.filter(s=>s.r.every(n=>on.includes(n)))}
function nearSyn(ids){const on=activeBonds(ids).filter(b=>kindOf(b)!=="clash").map(b=>b.n);return SYN.filter(s=>s.r.filter(n=>on.includes(n)).length===s.r.length-1)}
const synLv3=s=>synBonds(s).every(b=>bondLv(b)>=3);
function synChips(list){return list.map(s=>`<span class="bd syn"><b>相乗</b><span>${s.n}${S&&!S.done&&S.bl&&synLv3(s)?`<em class="lv">両方Lv3・倍</em>`:""}</span><small>${s.r.join("＋")}</small><i>${s.x}。毎月 ${Object.entries(s.d).map(([a,v])=>KS[a]+sgn(v)).join("・")}${s.k?"・国庫+"+s.k:""}${S&&S.bl?"（両方Lv3で倍）":""}</i></span>`).join("")}
function bondMonthly(L){
  const ids=sideIds();const tot={};let k=0;const src=[];
  activeBonds(ids).forEach(b=>{const p=bondPer(b); if(p){src.push(b.n);for(const s in p)tot[s]=(tot[s]||0)+p[s];if(b.per&&bondLv(b)>=3){const f=Object.keys(b.per)[0];tot[f]+=1}} if(b.perK&&kindOf(b)!=="clash"){k+=b.perK} });
  const cap={};for(const s in tot)cap[s]=Math.min(4,tot[s]);
  if(Object.keys(cap).length){apply(cap,true);L.push([`縁の効果（${src.slice(0,4).join("・")}${src.length>4?` ほか${src.length-4}`:""}）`,Object.entries(cap).map(([s,v])=>`${KS[s]}${sgn(v)}`).join(" ")])}
  if(k){S.kokko+=Math.min(2,k);L.push(["縁の効果（貿易と財政）",`国庫+${Math.min(2,k)}`])}
  const sy=activeSyn(ids);if(sy.length){const st={};let sk=0;
    sy.forEach(s=>{const m=synLv3(s)?2:1;for(const a in s.d)st[a]=(st[a]||0)+s.d[a]*m;sk+=(s.k||0)*m});
    const c2={};for(const a in st)c2[a]=Math.min(3,st[a]);apply(c2,true);if(sk)S.kokko+=Math.min(2,sk);
    S.synSeen=S.synSeen||[];sy.forEach(s=>{if(!S.synSeen.includes(s.n))S.synSeen.push(s.n)});
    L.push([`縁の相乗（${sy.map(s=>s.n).join("・")}）`,[...Object.entries(c2).map(([a,v])=>`${KS[a]}${sgn(v)}`),sk?`国庫+${Math.min(2,sk)}`:""].filter(Boolean).join(" ")])}
}
function bondChips(list){return list.map(b=>`<span class="bd ${b.foe?"foe":kindOf(b)}"><b>${b.foe?"因縁":bondLabel(b)}</b><span>${b.n}${!b.foe&&kindOf(b)!=="clash"&&S&&!S.done&&S.bl?`<em class="lv">Lv${bondLv(b)}</em>`:""}</span><small>${b.k.map(k=>nameOf(k)).join("・")}${b.min?`（${b.min}人以上）`:""}</small><i>${b.x}${bondEff(b)?`<span class="bloom">${bondEff(b)}</span>`:""}</i></span>`).join("")}

/* ---------- おまかせ（自動行動） ---------- */
const hopsTo=(k,r)=>{const P=S.pc[k];if(P.r===r)return 0;return isPM(k)||C[k]?.fly?1:route(P.r,r).length};
function autoPick(k){
  const P=S.pc[k];const ids=sideIds();let best=null;
  const busy=(pred)=>Object.entries(S.pc).some(([k2,P2])=>k2!==k&&P2.task&&pred(P2.task));
  const near=r=>{let v=0;for(const [k2,P2] of Object.entries(S.pc)){if(k2===k)continue;const tr=P2.task?P2.task.r:P2.r;if(tr!==r)continue;const b=pairBond(k,k2,ids);
    if(b&&kindOf(b)!=="clash")v+=8;else if(b)v+=MEDI(k)?6:-12;else if(MEDI(k)){const cl=Object.entries(S.pc).some(([k3,P3])=>k3!==k&&k3!==k2&&(P3.task?P3.task.r:P3.r)===r&&(()=>{const bb=pairBond(k2,k3,ids);return bb&&kindOf(bb)==="clash"})());if(cl)v+=10}}return v};
  const consider=(r,a,sc)=>{if(!a)return;sc+=near(r)-hopsTo(k,r)*4;if(!best||sc>best.sc)best={r,a,sc}};
  S.marks.forEach(m=>{if(busy(t=>t.m===m.id))return;const a=actionsFor(k,m.r).find(x=>x.id==="fix"&&x.m===m.id);consider(m.r,a,fixP(k,m)*40+(m.left<10?15:0)+(m.left<5?10:0))});
  Object.entries(S.op).forEach(([o,O])=>{if(O.path&&O.path.length||!DOM.includes(O.r))return;if(busy(t=>t.id==="rally"&&t.r===O.r))return;const p=debP(k,o);if(p<.42)return;consider(O.r,actionsFor(k,O.r).find(x=>x.id==="rally"),p*45+OPP[o].s*2)});
  if(S.scout&&!busy(t=>t.id==="scout")){consider(S.scout.r,actionsFor(k,S.scout.r).find(x=>x.id==="scout"),scoutP(k)*50)}
  if(skA(k,"diplo")>=4&&S.st.dip<60&&!busy(t=>t.id==="gaiyu")){const r=["as","eu","na"].sort((a,b)=>hopsTo(k,a)-hopsTo(k,b))[0];consider(r,actionsFor(k,r).find(x=>x.id==="gaiyu"),(60-S.st.dip)*.6+skA(k,"diplo")*3)}
  DOM.forEach(r=>{const def=(62-supR(r))*Math.sqrt(RG[r].seats)/6;const A=actionsFor(k,r);
    const ra=A.find(x=>x.id==="rally");if(ra&&!busy(t=>t.id==="rally"&&t.r===r))consider(r,ra,def*(.5+skA(k,"speech")*.15)+(S.base[r]?6:0));
    const low=Object.entries(S.rp[r]).sort((a,b)=>a[1]-b[1])[0];const da=A.find(x=>x.id==="dev"&&x.k===low[0]);if(da&&(C[k]?.localFree||S.kokko>=0))consider(r,da,(60-low[1])*.5+da.sk*3+def*.2-(C[k]?.localFree?0:S.kokko<0?80:S.kokko<5?25:0))});
  return best;
}
function autoTick(){
  if(!S.auto)return;
  for(const k of Object.keys(S.pc)){if(!S.auto[k])continue;const P=S.pc[k];if(P.task||(P.path&&P.path.length))continue;
    const b=autoPick(k);if(b){dispatch(k,b.r,b.a,true);P.task.dur*=1.3;P.task.auto=1;}}
}

/* ---------- 相関図 ---------- */
function relChart(ids,title){
  const ms=[...new Set(ids)].filter(k=>k==="ieyasu"||C[k]);const n=ms.length;if(n<2)return "";
  const W=360,H=360,cx=W/2,cy=H/2,R=n<=8?120:n<=14?140:150;
  const pos={};ms.forEach((k,i)=>{const a=-Math.PI/2+i/n*Math.PI*2;pos[k]=[cx+Math.cos(a)*R,cy+Math.sin(a)*R]});
  const col={bond:"var(--kin)",rival:"#7fb0ff",clash:"var(--shu)"};const lines=[];
  activeBonds(ms).forEach(b=>{const mem=b.k.filter(k=>ms.includes(k));const kd=kindOf(b);const lv=bondLv(b);
    const pairs=mem.length===2?[[mem[0],mem[1]]]:mem.map((k,i)=>[k,mem[(i+1)%mem.length]]).slice(0,mem.length===3?3:mem.length);
    pairs.forEach(([a,c])=>{const [x1,y1]=pos[a],[x2,y2]=pos[c];lines.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col[kd]}" stroke-width="${(mem.length>2?1.5:2.5)+(lv-1)*1.2}" ${kd==="clash"?'stroke-dasharray="5 4"':""} opacity="${mem.length>2?.55:.9}"/>`)});
    if(mem.length===2){const [x1,y1]=pos[mem[0]],[x2,y2]=pos[mem[1]];lines.push(`<text x="${(x1+x2)/2}" y="${(y1+y2)/2-3}" class="rel-t" fill="${col[kd]}">${b.n}${kd!=="clash"&&S&&S.bl?" "+lv:""}</text>`)}});
  const sz=n>14?30:36;
  return `<div class="rel"><div class="rel-in"><svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${lines.join("")}</svg>${ms.map(k=>{const [x,y]=pos[k];return `<span class="rel-p" style="left:${x/W*100}%;top:${y/H*100}%">${portrait(k,sz)}<small>${nameOf(k).replace(/^(徳川|豊臣|織田|明智|坂本|北条|武田|上杉|真田|前田|伊達|本多|井伊|酒井|榊原|黒田|竹中)/,"")}</small></span>`}).join("")}</div>
  <div class="rel-leg"><span style="--c:var(--kin)">連携</span><span style="--c:#7fb0ff">好敵手</span><span style="--c:var(--shu)">犬猿</span>${S&&S.bl?"<span class='muted'>線の太さ＝縁の深さ</span>":""}</div></div>`;
}

  for(const b of OBONDS){if(!b.k.includes(o)||!obOn(b,here))continue;if(b.kind==="clash")return b;if(!best||b.kind==="rival")best=b}return best}

  if(cnt[t]>=2&&T.filter(x=>cnt[x]===cnt[t]).length>=2)t="anei";
  const c=CNAME[t];return {t,n:c.w+(CNTAG[tag]||"")+"内閣",b:c.b,wk:c.wk}}catch(e){return null}}
function cnLine(){try{const c=S&&S.cn;if(!c)return "";

function cnBox(ids,tag){const c=cnOf(ids,tag);

      <li><b>組閣</b>　まず総理大臣を選ぶ（小野妹子・前島密を加えた100人あまりの誰でも総理になれ、総理のときだけ働く「総理の特技」が一人ずつある。家康は大臣にもなれる）。次に主要6ポスト（官房・財務・外務・厚労・防衛・総務）に偉人を任命。法務・経産・文科・国交・農水・デジタルの6ポストは任意で、適任者を置くと毎月効果がある。得意分野の●が多いほど政策が効く。各大臣は固有の特技を持ち、相性の悪い組み合わせは閣内結束を下げる。</li>
      <li><b>政務</b>　毎月ひとつ案件が届く。担当大臣には持論があり、推奨案を採ると本気を出す。退けると不満がたまり、限界を超えると辞任する。</li>
      <li><b>内政</b>　毎月 政治資本3を使って政策を打つ。国庫（兆円）が赤字になると財政危機。</li>
      <li><b>国会</b>　看板法案を提出し、数か月の審議を経て採決。成立すれば毎月効き続ける。強行採決を重ねると西軍が対決姿勢になり、審議拒否が増える（国対委員長との手打ちで解ける）。</li>
      <li><b>人物</b>　大臣ごとに固有の事件が起きる。信長と光秀を同じ内閣に入れると……。進言どおり動かすと大臣は成長する。</li>
      <li><b>日本地図</b>　毎月、総理と大臣の駒を全国どこへでも派遣できる。遊説・地域振興・問題への対処・海外への外遊。得意分野の人を送るほどうまくいく。</li>
      <li><b>リアルタイム</b>　地図では時間が流れる（1か月は約40秒、一時停止と倍速あり）。駒は道筋をたどって移動し、着いた先で作業する。西軍党も同時に動き回り、鉢合わせると論戦になる。問題には期限があり、月の半ばには速報が飛び込む。</li>
      <li><b>おまかせ</b>　駒を選んで「おまかせ」をONにすると、手が空いたときに自分で動く。得意な問題の解決、勝てそうな論戦、在野の偉人の説得、支持の低い地方の遊説などを選び、縁のある仲間のいる地方を好む。仲裁役は犬猿の二人の所へ向かう。</li>
      <li><b>政治の暦</b>　1月 通常国会（所信表明）、3月 予算成立、5月 サミット、6月 国会の会期末（法案を強行採決か廃案か）、9月 与党総裁選（負ければ即退陣）、12月 総選挙。</li>
      <li><b>世論調査</b>　毎月の決算で「今選挙をしたら何議席か」の予測が出る。勝ちすぎの予測が出ると、西軍党は野党共闘で勢いを増し、刺客を増やしてくる。地方の支持が高くなるほど議席の上積みは伸びにくい（接戦区や西軍の地盤があるため）。一つの地方を固めるより、8地方をまんべんなく上げる方が議席は増える。</li>
      <li><b>地図の全自動</b>　地図の時間は最初から全自動。駒は全員おまかせで動き、速報への対応、掛け合い、空海・晴明への対処、月末の締めまで自動で進む。国庫が赤字の間は、全自動は地方の開発を控え、速報や案件でも国庫が減らない方を選びやすくなる。案件・国会・官邸の政務・決算は自分で決める。上の「地図 全自動中」か下の「止める」で手動に戻せる。</li>
      <li><b>公約</b>　組閣のときに14の公約から3つを選ぶ。12月の総選挙で達成していれば1つにつき+10議席、未達なら-8議席。全部守ればさらに+6議席。</li>
      <li><b>口ぐせ方針</b>　組閣のときに総理の口ぐせを一つ選ぶ。「大胆」は強行採決が通れば支持+2（否決なら-2）、「調整」は西軍党の対決姿勢が1か月早く和らぐ、「倹約」は初期の国庫+1、「人心掌握」は初期の支持+2。</li>
      <li><b>補佐の型</b>　大臣と特命チームの一人ずつに、能力から決まる型がある。調整役は派閥の不満を抑え、現場派は陳情で支持を上げ、財務派は赤字の痛手を軽くし、鼓舞役は支持か結束が10以下になっても一年に一度だけ踏みとどまらせ、外交通（外交の力が5の人物）は首脳会談で相手国との関係の伸びを+1する（同じ型は2人まで効く）。</li>
      <li><b>内閣の合言葉</b>　いちばん多い補佐の型と口ぐせ方針で内閣名が決まる（例：殖産改革内閣。外交通が多ければ「開国」、多い型が二つ並べば「安寧」）。得意の指標が初期+2、そのかわり苦手の指標を伸ばす案件は月に一度、効きが1つ弱い。</li>
      <li><b>変則ルール</b>　組閣のときに今年の変則ルールを選べる（米価高騰・外圧・人材難・祝祭・災害の年・大博覧の年）。指標が少し上下した所から始まり、毎月その指標が低いと別の指標が下がり、高いと別の指標が上がる。選ばなくてもよい。</li>
      <li><b>最終公約の一枚札</b>　12月の公示のあとに「減税」「改革断行」「安定継続」「安全第一」「外交で国を開く」「暮らし第一」「財政再建」の7枚から一枚を切る。勝てば次の政権の初期値に+2が残る。</li>
      <li><b>国家目標</b>　1〜2月に8つの国家目標（産業再生・地方復興・外交安定・治安の要・挙党一致・信頼回復・富国安民・内外安定）から一つを掲げられる。合う案には◎が付く。その指標を掲げた時から+10伸ばせば達成（二つの指標を組にした富国安民〔経済と民生〕・内外安定〔外交と治安〕は、両方が伸びるか片方が+5以上の案に◎が付き、二つの平均を+8伸ばせば達成）（掲げた時点で高い指標は、上の余地の半分が目安。例：結束96なら+2）。</li>
      <li><b>重点月間</b>　7〜11月の月初に8つの月間（物価対策・防災・外交・暮らし安心・党内融和・広報強化・地方創生・遊説強化）から一つを掲げられる。その分野の案・任務の効きが+1（国家目標と同じ分野なら+2）、担当大臣は少し疲れる。地方創生は民生の案と地図の地域振興に、遊説強化は支持の案と地図のふつうの遊説に効く。</li>
      <li><b>接戦区の陳情</b>　10〜11月、接戦区の地方から陳情が届く。受けるとその地方の支持が上がるが政治資本と担当大臣の体力を使い、断ると支持が少し下がる。</li>
      <li><b>西軍の作戦</b>　2〜10月、西軍党はこちらの弱い指標を狙って作戦（物価追及・地方行脚・失言攻め・与党の切り崩しなど10種）を一つ打ってくる。12日ごろ判明（独自調査の月は月初）。月末にその指標が55未満なら支持が下がり、65以上なら空振りで西軍の勢いが落ちる。</li>
      <li><b>結果を共有</b>　結末の画面の「結果を共有」で、総理・議席・支持率・国家目標・称号・三大ニュースを短い文にまとめ、送ったり写したりできる。</li>
      <li><b>野党の追及</b>　3〜9月の月半ばには、速報の代わりに西軍党の追及（財政・地方・慢心）が来ることがある。丁寧に答えれば確実だが閣僚が疲れ、押し切れば成功で西軍の勢いを削げるが、失敗すると痛い。</li>
      <li><b>派閥の政策要求</b>　8〜11月、不満が40〜69の派閥は領袖を立てて政策の要求を突きつける。飲めばその派閥の不満が大きく下がるが、指標が上下し、別の派閥が少し不満を持つ。突っぱねると不満が増え、70で造反。同じ派閥が二度目に出るときは別の要求（攻め派・民本派・協調派）になることがある。</li>
      <li><b>巷の声</b>　月末の令和瓦版には、その月いちばん大きく動いた指標（支持・経済・民生・治安・外交・結束）について、町の人の声が一つ載る。</li>
      <li><b>称号</b>　結末では戦い方に応じて31の称号から当てはまる物が付く（例：陳情を2件以上受けて勝つ「聞く耳」、重点月間を4か月以上掲げて勝つ「旗振り役」、鼓舞役の補佐で踏みとどまって勝つ「土俵際」）。</li>
      <li><b>前の政権から</b>　二度目からは、前の政権の称号を「遺産」に選んで始められる。遺産の指標を始めから+8以上伸ばして勝つ「二周目目標」を果たすと、次の政権は支持+2で始まる。また前の政権の最後にいちばん低かった指標は、2月に「前政権の宿題」の案件として届く。</li>
      <li><b>縁</b>　偉人同士には300を超える縁と、40以上の「縁の相乗」がある。西軍党同士にも縁があり、刎頸の友（三成と吉継）や真田父子が同じ地方に並ぶと手ごわくなり、逆に仲の悪い二人が並ぶと弱くなる。吉川広家・脇坂安治・小早川秀秋は論破すると離党することがある。師弟や盟友は同じ地方で作業すると「連携」して速く強くなり、好敵手は競い合い、犬猿の仲は口論で作業が止まる。三英傑・徳川四天王・幕末の志士などは、そろえると毎月ボーナス。西軍党との因縁があれば論戦に強い。縁が初めて働いたときは、その二人の掛け合いが見られる。地図では論戦や問題解決のたびに、偉人や西軍党が吹き出しでひと言しゃべる。連携を重ねると縁が深まり（最大Lv3）効果が強くなる。犬猿の二人がいる地方に、秀長・ねね・篤姫・聖徳太子・勝海舟など仲裁役を送ると和解させられる。小早川秀秋は論破すると寝返ることも。</li>
      <li><b>特命チーム</b>　服部半蔵・水戸光圀・沖田総司など30人から3人を選び、大臣とは別に現場へ送り込める。</li>
      <li><b>地方</b>　8地方それぞれに産業・治安・暮らしの値があり、低いところから問題が起きる。底上げすると支持が育つ。</li>
      <li><b>西軍党</b>　石田三成が率いる「歴史の敗者たち」80人。毎月、顔ぶれが入れ替わって送り込まれてくる。三成らの駒が各地を遊説し、居座った地方に地盤（旗）を築く。地盤は毎月支持を削り、選挙でも不利。論戦に勝つか遊説で崩す。</li>
      <li><b>在野の偉人</b>　伊達政宗・土方歳三など10人が各地に現れる。説得すれば協力者になり、内閣改造で大臣にもできる。放っておくと西軍党に取られる。</li>
      <li><b>危機と連鎖</b>　判断は数か月後の続報を呼ぶ。国の状態が悪化すると景気後退・デモ・造反、最悪は内閣不信任案が出る。</li>
      <li><b>先送り</b>　総理は案件を1回先送りできる。家康が総理なら「鳴くまで待とう」で3回、しかも支持が下がらない。</li>
      <li><b>決着</b>　12月の総選挙「令和の関ヶ原」で465議席中233以上なら政権維持。支持率か閣内結束が10以下になると即退陣。</li>
    </ul></div>
  </section>`;

function scale(d,sk,opt={}){
  const up=0.5+sk*0.2, dn=Math.max(0.5,1.4-sk*0.15);
  const out={};
  for(const k in d){
    let v=d[k];
    v = v>0 ? v*up : v*dn*(opt.halfNeg?0.5:1);
    out[k]=Math.round(v);
  }
  return out;
}

function apply(d,raw){
  for(const k in d){ if(!K.includes(k)||!d[k])continue;
    const v0=S.st[k]; let v=d[k];
    if(!raw){ v = v>0 ? v*Math.max(0.15,Math.min(1.2,(100-v0)/50)) : v*Math.max(0.7,Math.min(1.6,v0/50)); v=Math.round(v)||Math.sign(d[k]);
      if(k==="sup"&&v0>=MAN_TH&&!koukiOn()){const v1=v>0?Math.round(v*.7):Math.round(v*1.3);const lost=Math.abs(v1-v);if(lost){if(!S.manM||S.manM.m!==S.month)S.manM={m:S.month,n:0};S.manM.n+=lost}v=v1;} }
    if(!raw&&v>0&&S.cnW===k&&S.cnWm!==S.month){S.cnWm=S.month;v=Math.max(0,v-1)}
    const before=S.st[k]; S.st[k]=clamp(S.st[k]+v);
    S.delta[k]=(S.delta[k]||0)+(S.st[k]-before);
  }
}
function addDis(key,v){
  if(!key)return;

  S.dis[key]=Math.max(0,Math.min(100,(S.dis[key]||0)+v));
}

function kobuRescue(){const n=aideN("kobu");if(!n||S.kobuUsed)return false;
  S.kobuUsed=1;const v=n>=2?20:15;let w=[];
  if(S.st.sup<=10){S.st.sup=v;w.push("支持")}if(S.st.coh<=10){S.st.coh=v;w.push("結束")}
  const who=aideIds().filter(k=>aideOf(k)==="kobu").map(k=>C[k].n)[0]||"";
  S.log.push([S.month,`${who}が内閣を鼓舞し、${w.join("・")}が${v}で踏みとどまった（一年に一度）`]);
  S.news.push({m:S.month,h:"内閣、崖っぷちで踏みとどまる",c:`${who}「ここで倒れては、民に顔向けができぬ」`});
  return true}
function checkFall(){
  if((S.st.sup<=10||S.st.coh<=10)&&kobuRescue()){save();return false}
  if(S.st.sup<=10||S.st.coh<=10){S.done=true;S.fall=S.st.coh<=10?"coh":"sup";save();ending();return true}
  return false;
}

function cmdCost(c){

function autoCabinet(){

  const score=(k,f)=>{const ids=[...Object.values(pick),...team,pmPick];const nb=activeBonds([...ids,k]).filter(b=>!activeBonds(ids).includes(b));
    return C[k].s[SKI[f]]*10+nb.filter(b=>b.kind!=="clash").length*6-nb.filter(b=>b.kind==="clash").length*12+Math.random()*3};
  const cands=()=>Object.keys(C).filter(k=>!C[k].scout&&!C[k].agent&&!taken().has(k));
  POSTS.forEach(p=>{if(pick[p.id])return;const b=cands().sort((a,b)=>score(b,p.field)-score(a,p.field))[0];if(b)pick[p.id]=b;});

  const ag=Object.keys(C).filter(k=>C[k].agent&&!team.includes(k));

}

  let E=0,W=0,i=0,crossed=false;
  const voice=(k,mood,t,who)=>{const v=$("#khVoice");if(v)v.innerHTML=`${portrait(k,44,mood)}<div class="quote">「${t}」<small>${who}</small></div>`};
  const draw=()=>{const g=id=>document.getElementById(id);if(!g("khE"))return false;
    g("khE").textContent=E;g("khW").textContent=W;g("khBE").style.width=(E/465*100)+"%";g("khBW").style.width=(W/465*100)+"%";
    const left=465-E-W;g("khLeft").textContent=left>0?`未確定 ${left}`:"全議席確定";return true};
  const call=(t,sub,ng)=>{const c=$("#khCall");if(!c)return;c.hidden=false;c.className="kh-call"+(ng?" ng":"");c.innerHTML=`${t}<small>${sub}</small>`};
  voice(PK,"normal","開票が始まった。皆の者、腹を据えよ",`総理　${PN}`);
  const step=()=>{if(!draw())return;
    const el=document.querySelector(`.kh-r[data-i="${i}"]`);if(el)el.classList.add("on");
    if(i<rr.length){const x=rr[i];E+=x.w;W+=x.seats-x.w;
      if(i===Math.floor(rr.length/2)){E>=W?voice("mitsunari","angry","まだ大票田が残っておる！勝負はこれからじゃ","西軍党 党首　石田三成"):voice(PK,"angry","…まだだ。最後の一票まで分からぬ",`総理　${PN}`)}
    } else {E=S.seats;W=465-S.seats}
    draw();
    if(!crossed&&E>=233){crossed=true;call("東軍 過半数確保","偉人内閣、政権維持が確実に",false)}
    i++;
    if(i<=rr.length){off?step():setTimeout(step,STEP);return}
    {const ks=$("#khSek");if(ks)ks.hidden=false}
    if(!win)call("東軍 過半数割れ",`あと${233-S.seats}議席届かず`,true);

    win?voice(PK,"happy",lineOf(PK,"w")||"民の声に救われた。だが、驕るまいぞ",`総理　${PN}`):voice("mitsunari","happy",oppLine("mitsunari","v"),"西軍党 党首　石田三成");
    if(S.fullAuto)setTimeout(()=>{if(document.getElementById("khE"))ending()},2600);
  };
  off?step():setTimeout(step,STEP);
}
/* ---------- 選挙と結末 ---------- */
function election(){
  const op=S.opp??45; let tot=0; S.regRes=[];
  DOM.forEach(r=>{const R=RG[r];const sr=supR(r);
    const sh=seatShare(sr,op,S.base[r]||0,(Math.random()-.5)*.08);
    const w=Math.round(R.seats*sh);tot+=w;S.regRes.push({r,sr,w,seats:R.seats});});
  tot+=DIFF[S.diff||"normal"].seat;
  S.pledgeRes=(S.pledges||[]).map(id=>{let ok=false;try{ok=PL[id].f(S)}catch(e){}return {id,ok}});
  const pOK=S.pledgeRes.filter(x=>x.ok).length,pNG=S.pledgeRes.length-pOK;
  tot+=pOK*10-pNG*8+(S.pledgeRes.length&&pNG===0?6:0);
  tot+=Object.values(S.bills||{}).filter(b=>b.st==="passed").length*2;
  if(S.kokko<0)tot-=10;
  S.seats=Math.max(30,Math.min(440,Math.round(tot)));
  save();kaihyo();
}
/* 結末の「結果を共有」：総理・結末・議席・支持率・国家目標・称号・三大ニュースを短い文に */
function shareText(rank,avgG,earned){try{const T=x=>String(x==null?"":x).replace(/<[^>]+>/g,"").trim();const L=["【偉人内閣シミュレータ】"];
  L.push(`総理：${T(pmName())}（難易度：${T(DIFF[S.diff||"normal"].n)}）`);
  L.push(S.fall?`結末：${rank}（${S.month}月に退陣）`:`結末：${rank}　獲得議席 ${S.seats}／465`);
  L.push(`支持率 ${S.st.sup}%・政権評価 ${avgG}`);
  const g=goalOf();if(g&&!S.fall)L.push(`国家目標：${g.n}（${goalDone()?"達成":"届かず"}）`);
  if(earned&&earned.length)L.push(`称号：${earned.slice(0,4).map(t=>t.t).join("・")}${earned.length>4?` ほか${earned.length-4}`:""}`);
  const KEY=/総裁選|不信任|成立|可決|否決|選挙|辞任|改造|サミット|議席/;const N=(S.news||[]).filter(n=>n&&n.h);
  const top=[...N.filter(n=>KEY.test(n.h)),...N.filter(n=>!KEY.test(n.h))].slice(0,3).sort((a,b)=>(a.m||0)-(b.m||0));
  if(top.length){L.push("今年の三大ニュース");top.forEach(n=>L.push(`・${n.m||"?"}月 ${T(n.h)}`))}
  return L.join("\n")}catch(e){return "【偉人内閣シミュレータ】"}}
function shareRes(tx){const out=$("#shareOut");const show=m=>{if(out)out.innerHTML=m};
  const area=()=>show(`<textarea class="share-tx" readonly rows="9">${tx.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</textarea><small class="muted">長押しでコピーしてください</small>`);
  try{if(navigator.share){navigator.share({title:"偉人内閣シミュレータ",text:tx}).catch(()=>{});return}}catch(e){}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(()=>show(`<small class="muted">結果の文をコピーした</small>`),area);return}}catch(e){}
  area()}

  else newT.push(...(S.newT||[]));

  <div class="speaker">${portrait(oppLeadK(),56,win?"angry":"happy")}<div class="quote">「${oppLine(oppLeadK(),win?"d":"v")}」<small>西軍党 党首　${OPP[oppLeadK()].n}</small></div></div>`;
